<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Predicciones — Quiniela B&B 2026</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <meta name="theme-color" content="#003087" />
</head>
<body>
<script src="/js/api.js"></script>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="header-brand">
      <div class="header-logo">B&B</div>
      <div class="header-title">
        Quiniela B&amp;B
        <span>Copa del Mundo 2026</span>
      </div>
    </a>
    <nav class="header-nav" id="headerNav">
      <div class="spinner" style="width:24px;height:24px;border-width:3px;"></div>
    </nav>
  </div>
</header>

<!-- BOTTOM NAV (móvil) -->
<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="/" class="bnav-item">
      <span class="bnav-icon">🏠</span>Inicio
    </a>
    <a href="/quiniela.html" class="bnav-item active">
      <span class="bnav-icon">⚽</span>Predecir
    </a>
    <a href="/leaderboard.html" class="bnav-item">
      <span class="bnav-icon">🏆</span>Tabla
    </a>
  </div>
</nav>

<!-- MAIN -->
<main class="container">
  <div id="pageContent">
    <div class="loading-overlay">
      <div class="spinner"></div>
      <span>Cargando…</span>
    </div>
  </div>
</main>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ==================== STATE ====================
let currentUser = null;
let allMatches = [];
let myPredictions = {};   // match_id → { home_score, away_score }
let currentGroup = 'A';
const GROUPS_ORDER = ['A','B','C','D','E','F','G','H','I','J','K','L'];

// ==================== INIT ====================
async function init() {
  try {
    const meR = await fetch('/api/auth/me');
    const meD = await meR.json();
    if (!meD.user) {
      window.location.href = '/?login=1';
      return;
    }
    currentUser = meD.user;
    updateHeader();

    const [matchesR, predsR] = await Promise.all([
      fetch('/api/matches'),
      fetch('/api/predictions'),
    ]);
    const matchesD = await matchesR.json();
    const predsD   = await predsR.json();

    allMatches = matchesD.matches;

    for (const p of predsD.predictions) {
      myPredictions[p.match_id] = { home_score: p.home_score, away_score: p.away_score };
    }

    renderPage();
  } catch (err) {
    document.getElementById('pageContent').innerHTML = `
      <div class="alert alert-error">Error al cargar datos. <a href="/">Volver al inicio</a></div>
    `;
  }
}

// ==================== HEADER ====================
function updateHeader() {
  const nav = document.getElementById('headerNav');
  const initials = currentUser.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  nav.innerHTML = `
    <a href="/leaderboard.html" class="btn-nav">🏆 Tabla</a>
    <div class="user-chip" onclick="handleLogout()">
      <div class="user-avatar">${initials}</div>
      ${currentUser.name.split(' ')[0]}
      <span style="opacity:0.6;font-size:0.7rem;">Salir</span>
    </div>
  `;
}

async function handleLogout() {
  await apiFetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/';
}

// ==================== RENDER ====================
function renderPage() {
  const pc = document.getElementById('pageContent');
  const groups = [...new Set(allMatches.map(m => m.group_name))].sort();

  // Build group summary for tabs
  const tabsHtml = groups.map(g => {
    const gMatches = allMatches.filter(m => m.group_name === g);
    const now = new Date();
    const open = gMatches.filter(m => {
      const d = new Date(new Date(m.match_date).getTime() - 24*3600*1000);
      return now < d && !m.home_score && m.home_score !== 0;
    });
    const filled = gMatches.filter(m => myPredictions[m.id]);
    return `<button class="tab-btn${g === currentGroup ? ' active' : ''}" onclick="switchGroup('${g}')">
      Grupo ${g}
      ${filled.length > 0 ? `<span style="margin-left:4px;opacity:0.7;font-size:0.72rem;">(${filled.length}/${gMatches.length})</span>` : ''}
    </button>`;
  }).join('');

  pc.innerHTML = `
    <div class="page-header">
      <h1>⚽ Mis Predicciones</h1>
      <p>Selecciona el marcador que crees para cada partido. Cierra 24 h antes de cada partido.</p>
    </div>
    <div class="tabs" id="groupTabs">${tabsHtml}</div>
    <div id="groupContent"></div>
  `;

  renderGroup(currentGroup);
}

function switchGroup(g) {
  currentGroup = g;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().startsWith('Grupo ' + g));
  });
  renderGroup(g);
}

function renderGroup(groupLetter) {
  const matches = allMatches.filter(m => m.group_name === groupLetter);
  const now = new Date();

  const matchRows = matches.map(m => {
    const matchDate = new Date(m.match_date);
    const deadline  = new Date(matchDate.getTime() - 24 * 3600 * 1000);
    const isLocked  = now >= deadline;
    const hasResult = m.home_score !== null && m.home_score !== undefined;
    const myPred    = myPredictions[m.id];

    const dateStr = matchDate.toLocaleDateString('es-CO', {
      weekday: 'short', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit', timeZone: 'America/Bogota'
    });

    let inputsHtml = '';
    if (hasResult) {
      // Match already played — show actual result + prediction badge
      let badge = '';
      if (myPred) {
        if (myPred.home_score === m.home_score && myPred.away_score === m.away_score) {
          badge = `<span class="match-result-badge result-exact">🎯 +3 pts</span>`;
        } else {
          const po = Math.sign(myPred.home_score - myPred.away_score);
          const ao = Math.sign(m.home_score - m.away_score);
          if (po === ao) badge = `<span class="match-result-badge result-outcome">✅ +1 pt</span>`;
          else           badge = `<span class="match-result-badge result-miss">❌ 0 pts</span>`;
        }
      }
      inputsHtml = `
        <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:0.5rem;margin-bottom:0.3rem;">
          <div style="text-align:right;font-size:1.4rem;font-weight:900;color:var(--primary);">${m.home_score}</div>
          <div style="font-size:0.75rem;color:var(--gray-mid);">FINAL</div>
          <div style="font-size:1.4rem;font-weight:900;color:var(--primary);">${m.away_score}</div>
        </div>
        <div style="text-align:center;">
          ${myPred ? `<div style="font-size:0.75rem;color:var(--gray-mid);">Tu predicción: ${myPred.home_score}-${myPred.away_score}</div>` : '<div style="font-size:0.75rem;color:var(--gray-mid);">Sin predicción</div>'}
          ${badge}
        </div>`;
    } else if (isLocked) {
      const savedPred = myPred ? `${myPred.home_score} - ${myPred.away_score}` : 'Sin predicción';
      inputsHtml = `
        <div class="match-locked">🔒 Cerrado — Tu predicción: <strong>${savedPred}</strong></div>`;
    } else {
      const hv = myPred !== undefined ? myPred.home_score : '';
      const av = myPred !== undefined ? myPred.away_score : '';
      const deadlineStr = deadline.toLocaleDateString('es-CO', {
        weekday: 'short', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit', timeZone: 'America/Bogota'
      });
      inputsHtml = `
        <div class="score-inputs">
          <input type="number" class="form-control score-input" min="0" max="20" step="1"
            id="h_${m.id}" value="${hv}" placeholder="0" style="justify-self:end;" />
          <span class="vs-sep">-</span>
          <input type="number" class="form-control score-input" min="0" max="20" step="1"
            id="a_${m.id}" value="${av}" placeholder="0" style="justify-self:start;" />
        </div>
        <div class="match-date">⏰ Cierra: ${deadlineStr}</div>`;
    }

    return `
      <div class="match-row" data-match-id="${m.id}" data-locked="${isLocked || hasResult}">
        <div class="match-teams">
          <div class="team-name home">${m.home_team}</div>
          <div class="score-separator">vs</div>
          <div class="team-name away">${m.away_team}</div>
        </div>
        ${inputsHtml}
        <div class="match-date" style="margin-top:0.2rem;">📅 ${dateStr}</div>
      </div>`;
  }).join('');

  const hasOpenMatches = matches.some(m => {
    const deadline = new Date(new Date(m.match_date).getTime() - 24*3600*1000);
    const hasResult = m.home_score !== null && m.home_score !== undefined;
    return now < deadline && !hasResult;
  });

  const gc = document.getElementById('groupContent');
  gc.innerHTML = `
    <div class="group-card">
      <div class="group-card-header">
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <div class="group-letter">${groupLetter}</div>
          <div class="group-title">Grupo ${groupLetter}</div>
        </div>
        ${getGroupStatus(matches, now)}
      </div>
      <div id="matchList">${matchRows}</div>
      ${hasOpenMatches ? `
        <div class="group-save-btn">
          <button class="btn btn-secondary btn-block" onclick="saveGroup('${groupLetter}')">
            💾 Guardar predicciones del Grupo ${groupLetter}
          </button>
        </div>` : ''}
    </div>
    <div id="saveAlert" style="margin-top:1rem;"></div>
  `;
}

function getGroupStatus(matches, now) {
  const results = matches.filter(m => m.home_score !== null && m.home_score !== undefined);
  if (results.length === matches.length) {
    return `<span class="group-status closed">Finalizado</span>`;
  }
  const open = matches.filter(m => {
    const d = new Date(new Date(m.match_date).getTime() - 24*3600*1000);
    return now < d && (m.home_score === null || m.home_score === undefined);
  });
  if (open.length === matches.length) return `<span class="group-status open">Abierto</span>`;
  if (open.length > 0) return `<span class="group-status partial">Parcial</span>`;
  return `<span class="group-status closed">Cerrado</span>`;
}

// ==================== SAVE ====================
async function saveGroup(groupLetter) {
  const matches = allMatches.filter(m => m.group_name === groupLetter);
  const now = new Date();
  const predictions = [];

  for (const m of matches) {
    const deadline  = new Date(new Date(m.match_date).getTime() - 24 * 3600 * 1000);
    const hasResult = m.home_score !== null && m.home_score !== undefined;
    if (now >= deadline || hasResult) continue;

    const hEl = document.getElementById(`h_${m.id}`);
    const aEl = document.getElementById(`a_${m.id}`);
    if (!hEl || !aEl) continue;

    const hv = hEl.value;
    const av = aEl.value;
    if (hv === '' || av === '') continue;

    predictions.push({ match_id: m.id, home_score: parseInt(hv, 10), away_score: parseInt(av, 10) });
  }

  if (predictions.length === 0) {
    showAlert('No hay predicciones nuevas para guardar en partidos abiertos.', 'info');
    return;
  }

  try {
    const r = await apiFetch('/api/predictions/bulk', {
      method: 'POST',
      body: JSON.stringify({ predictions }),
    });
    const d = await r.json();

    if (d.errors && d.errors.length > 0) {
      showAlert('⚠️ Algunas predicciones no pudieron guardarse:<br>' + d.errors.join('<br>'), 'warning');
    }

    if (d.saved && d.saved.length > 0) {
      for (const mid of d.saved) {
        const hEl = document.getElementById(`h_${mid}`);
        const aEl = document.getElementById(`a_${mid}`);
        if (hEl && aEl) {
          myPredictions[mid] = { home_score: parseInt(hEl.value, 10), away_score: parseInt(aEl.value, 10) };
        }
      }
      showToast(`✅ ${d.saved.length} predicciones guardadas para el Grupo ${groupLetter}`, 'success');
      if (!d.errors || d.errors.length === 0) showAlert('', '');
    }

    // Refresh tab counts
    renderPage();
    document.querySelectorAll('.tab-btn').forEach(b => {
      if (b.textContent.trim().startsWith('Grupo ' + groupLetter)) b.classList.add('active');
    });
  } catch (err) {
    showAlert('Error de conexión. Intenta de nuevo.', 'error');
  }
}

// ==================== HELPERS ====================
function showAlert(msg, type) {
  const el = document.getElementById('saveAlert');
  if (!el) return;
  el.innerHTML = msg ? `<div class="alert alert-${type}">${msg}</div>` : '';
}

function showToast(msg, type = 'info') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

// ==================== BOOT ====================
init();
</script>
</body>
</html>
