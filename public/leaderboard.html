<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabla de Posiciones — Quiniela B&B 2026</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <meta name="theme-color" content="#003087" />
</head>
<body>
<script src="/js/api.js"></script>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="header-brand">
      <div class="header-logo">B&B</div>
      <div class="header-title">
        Quiniela B&amp;B
        <span>Copa del Mundo 2026</span>
      </div>
    </a>
    <nav class="header-nav" id="headerNav">
      <div class="spinner" style="width:24px;height:24px;border-width:3px;"></div>
    </nav>
  </div>
</header>

<!-- BOTTOM NAV (móvil) -->
<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="/" class="bnav-item">
      <span class="bnav-icon">🏠</span>Inicio
    </a>
    <a href="/quiniela.html" class="bnav-item">
      <span class="bnav-icon">⚽</span>Predecir
    </a>
    <a href="/leaderboard.html" class="bnav-item active">
      <span class="bnav-icon">🏆</span>Tabla
    </a>
  </div>
</nav>

<!-- MAIN -->
<main class="container">
  <div id="pageContent">
    <div class="loading-overlay">
      <div class="spinner"></div>
      <span>Cargando tabla de posiciones…</span>
    </div>
  </div>
</main>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ==================== TROPHY SVG ====================
let _trophyCounter = 0;
function buildTrophySVG(pct, color1 = '#F5A623', color2 = '#FFD700') {
  // pct = 0..100, fill from bottom to top within the trophy body
  // Trophy body spans from y=6 (top of ball) to y=168 (bottom of neck)
  const uid        = 'tr_' + (++_trophyCounter);
  const TROPHY_TOP = 6;
  const TROPHY_BTM = 170;
  const TROPHY_H   = TROPHY_BTM - TROPHY_TOP; // 164 px
  const fillH      = Math.round((pct / 100) * TROPHY_H);
  const yFill      = TROPHY_BTM - fillH; // clip starts here going downward

  return `
<svg class="trophy-svg" viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg" aria-label="Copa del Mundo">
  <defs>
    <linearGradient id="goldGrad_${uid}" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="${color1}"/>
      <stop offset="100%" stop-color="${color2}"/>
    </linearGradient>
    <linearGradient id="grayGrad_${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>
    <clipPath id="fillMask_${uid}">
      <rect x="0" y="${yFill}" width="200" height="${fillH + 50}"/>
    </clipPath>
  </defs>

  <!-- BASE / PEANA -->
  <rect x="60" y="186" width="80" height="12" rx="4" fill="url(#grayGrad_${uid})"/>
  <rect x="50" y="196" width="100" height="10" rx="5" fill="url(#grayGrad_${uid})"/>

  <!-- COLUMNA CENTRAL -->
  <rect x="85" y="168" width="30" height="22" rx="3" fill="url(#grayGrad_${uid})"/>

  <!-- TROFEO: cuerpo de fondo (gris) -->
  <g opacity="0.9">
    <!-- copa principal -->
    <path d="M60,20 L55,60 Q54,90 60,110 Q70,130 100,140 Q130,130 140,110 Q146,90 145,60 L140,20 Z"
          fill="#cfd8dc" stroke="#b0bec5" stroke-width="1"/>
    <!-- asa izquierda -->
    <path d="M60,35 Q30,35 28,65 Q26,90 55,90"
          fill="none" stroke="#b0bec5" stroke-width="10" stroke-linecap="round"/>
    <!-- asa derecha -->
    <path d="M140,35 Q170,35 172,65 Q174,90 145,90"
          fill="none" stroke="#b0bec5" stroke-width="10" stroke-linecap="round"/>
    <!-- cuello -->
    <path d="M80,140 Q80,165 85,168 L115,168 Q120,165 120,140 Z" fill="#cfd8dc"/>
    <!-- bola superior -->
    <circle cx="100" cy="16" r="10" fill="#b0bec5"/>
  </g>

  <!-- TROFEO: relleno de color (clipped) -->
  <g clip-path="url(#fillMask_${uid})">
    <!-- copa principal -->
    <path d="M60,20 L55,60 Q54,90 60,110 Q70,130 100,140 Q130,130 140,110 Q146,90 145,60 L140,20 Z"
          fill="url(#goldGrad_${uid})" stroke="${color1}" stroke-width="1"/>
    <!-- asa izquierda -->
    <path d="M60,35 Q30,35 28,65 Q26,90 55,90"
          fill="none" stroke="${color1}" stroke-width="10" stroke-linecap="round"/>
    <!-- asa derecha -->
    <path d="M140,35 Q170,35 172,65 Q174,90 145,90"
          fill="none" stroke="${color1}" stroke-width="10" stroke-linecap="round"/>
    <!-- cuello -->
    <path d="M80,140 Q80,165 85,168 L115,168 Q120,165 120,140 Z" fill="url(#goldGrad_${uid})"/>
    <!-- bola superior -->
    <circle cx="100" cy="16" r="10" fill="${color2}"/>
  </g>

  <!-- Porcentaje dentro de la copa -->
  ${pct > 15 ? `<text x="100" y="88" text-anchor="middle" font-size="16" font-weight="900"
    fill="${pct > 50 ? '#003087' : '#546e7a'}" font-family="system-ui,sans-serif">${Math.round(pct)}%</text>` : ''}
</svg>`;
}

// ==================== STATE ====================
let currentUser = null;

// ==================== INIT ====================
async function init() {
  try {
    const [meR, lbR] = await Promise.all([
      fetch('/api/auth/me'),
      fetch('/api/leaderboard'),
    ]);
    const meD = await meR.json();
    const lbD = await lbR.json();

    if (meD.user) {
      currentUser = meD.user;
      updateHeader();
    } else {
      updateHeaderGuest();
    }

    renderLeaderboard(lbD);
  } catch (err) {
    document.getElementById('pageContent').innerHTML = `
      <div class="alert alert-error">Error al cargar tabla. Intenta recargar la página.</div>
    `;
  }
}

// ==================== HEADER ====================
function updateHeader() {
  const nav = document.getElementById('headerNav');
  const initials = currentUser.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  nav.innerHTML = `
    <a href="/quiniela.html" class="btn-nav">⚽ Predecir</a>
    <div class="user-chip" onclick="handleLogout()">
      <div class="user-avatar">${initials}</div>
      ${currentUser.name.split(' ')[0]}
      <span style="opacity:0.6;font-size:0.7rem;">Salir</span>
    </div>
  `;
}

function updateHeaderGuest() {
  const nav = document.getElementById('headerNav');
  nav.innerHTML = `<a href="/" class="btn-nav active">Iniciar sesión</a>`;
}

async function handleLogout() {
  await apiFetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/';
}

// ==================== RENDER LEADERBOARD ====================
function renderLeaderboard(data) {
  const { leaderboard, playedMatches, totalMatches, maxPossiblePoints } = data;
  const pc = document.getElementById('pageContent');

  if (!leaderboard || leaderboard.length === 0) {
    pc.innerHTML = `
      <div class="page-header">
        <h1>🏆 Tabla de Posiciones</h1>
        <p>Copa del Mundo 2026 — Productos B&amp;B</p>
      </div>
      <div class="empty-state">
        <div class="empty-icon">🏆</div>
        <h3>Todavía no hay participantes</h3>
        <p>¡Sé el primero en registrarte y predecir!</p>
        <a href="/" class="btn btn-primary" style="margin-top:1rem;">Registrarse</a>
      </div>`;
    return;
  }

  // Find current user entry
  const myEntry = currentUser ? leaderboard.find(e => e.userId === currentUser.id) : null;

  // Rank icon helper
  function rankIcon(rank) {
    if (rank === 1) return '🥇';
    if (rank === 2) return '🥈';
    if (rank === 3) return '🥉';
    return `<span style="font-weight:700;color:var(--text-light);">#${rank}</span>`;
  }

  // MY TROPHY section (only if logged in)
  let myTrophyHtml = '';
  if (myEntry) {
    const pct = myEntry.percentage;
    myTrophyHtml = `
      <div class="trophy-section">
        <div class="trophy-title">Tu Copa del Mundo</div>
        <div class="trophy-name">${myEntry.name}</div>
        <div class="trophy-wrap">${buildTrophySVG(pct)}</div>
        <div class="trophy-points">${myEntry.points}</div>
        <div class="trophy-pts-label">puntos — posición #${myEntry.rank}</div>
        <div class="trophy-breakdown">
          <div class="trophy-stat">
            <div class="trophy-stat-val">${myEntry.exact}</div>
            <div class="trophy-stat-lbl">🎯 Exactos</div>
          </div>
          <div class="trophy-stat">
            <div class="trophy-stat-val">${myEntry.outcome}</div>
            <div class="trophy-stat-lbl">✅ Ganador</div>
          </div>
          <div class="trophy-stat">
            <div class="trophy-stat-val">${playedMatches}/${totalMatches}</div>
            <div class="trophy-stat-lbl">⚽ Jugados</div>
          </div>
        </div>
      </div>`;
  }

  // TABLE
  const rowsHtml = leaderboard.map(e => {
    const isMe = currentUser && e.userId === currentUser.id;
    const rowStyle = isMe ? 'background:#f0f5ff;font-weight:600;' : '';

    return `
      <tr style="${rowStyle}">
        <td class="rank-cell rank-${e.rank <= 3 ? e.rank : ''}">
          ${rankIcon(e.rank)}
        </td>
        <td>
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <div style="width:32px;height:32px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:800;color:white;flex-shrink:0;">
              ${e.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
            </div>
            <div>
              <div>${e.name}${isMe ? ' <span style="font-size:0.72rem;color:var(--primary);font-weight:700;">(Tú)</span>' : ''}</div>
              <div class="progress-mini">
                <div class="progress-mini-fill" style="width:${e.percentage}%"></div>
              </div>
            </div>
          </div>
        </td>
        <td><span class="points-badge">${e.points}</span></td>
        <td class="hide-mobile">${e.exact}</td>
        <td class="hide-mobile">${e.outcome}</td>
        <td>
          <div style="display:flex;align-items:center;gap:0.4rem;">
            <div style="width:${Math.min(60, e.percentage * 0.6)}px;height:8px;background:linear-gradient(90deg,var(--secondary),var(--primary-light));border-radius:4px;"></div>
            <span style="font-size:0.78rem;color:var(--text-light);">${e.percentage}%</span>
          </div>
        </td>
      </tr>`;
  }).join('');

  // TOP 3 TROPHIES (visual)
  const top3Html = leaderboard.slice(0, Math.min(3, leaderboard.length)).map((e, i) => {
    const colors = [
      ['#F5A623','#FFD700'],
      ['#A8B0B8','#D4D8DC'],
      ['#CD7F32','#E8A060'],
    ];
    const heights = ['220px', '180px', '160px'];
    return `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;">
        <div style="width:${120-i*20}px;height:${heights[i]};">${buildTrophySVG(e.percentage, colors[i][0], colors[i][1])}</div>
        <div style="font-size:0.9rem;font-weight:700;margin-top:0.5rem;color:var(--white);">${e.name.split(' ')[0]}</div>
        <div style="font-size:1.2rem;font-weight:900;color:${colors[i][0]};">${e.points} pts</div>
        <div style="font-size:0.72rem;opacity:0.7;color:var(--white);">#${e.rank}</div>
      </div>`;
  }).join('');

  const progressPct = totalMatches > 0 ? Math.round(playedMatches / totalMatches * 100) : 0;

  pc.innerHTML = `
    <div class="page-header">
      <h1>🏆 Tabla de Posiciones</h1>
      <p>Copa del Mundo 2026 · ${playedMatches} de ${totalMatches} partidos jugados</p>
    </div>

    <!-- Progreso del torneo -->
    <div class="card" style="margin-bottom:1.25rem;">
      <div class="card-body" style="padding:1rem 1.25rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
          <span style="font-size:0.85rem;font-weight:600;">Progreso del torneo</span>
          <span style="font-size:0.85rem;font-weight:700;color:var(--primary);">${playedMatches}/${totalMatches} partidos</span>
        </div>
        <div style="height:10px;background:var(--gray);border-radius:5px;overflow:hidden;">
          <div style="height:100%;width:${progressPct}%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:5px;transition:width 1s ease;"></div>
        </div>
        <div style="font-size:0.75rem;color:var(--text-light);margin-top:0.4rem;">${progressPct}% completado</div>
      </div>
    </div>

    ${myTrophyHtml}

    <!-- Top 3 visual (solo cuando hay partidos jugados) -->
    ${playedMatches > 0 && leaderboard.length >= 2 ? `
    <div style="background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%);border-radius:var(--radius);padding:1.5rem 1rem;margin-bottom:1.25rem;">
      <div style="text-align:center;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.7);margin-bottom:1rem;">🥇 Podio actual</div>
      <div style="display:flex;justify-content:center;align-items:flex-end;gap:1rem;flex-wrap:wrap;">
        ${top3Html}
      </div>
    </div>` : ''}

    <!-- Tabla completa -->
    <div class="card">
      <div class="card-header">
        <span class="card-icon">📊</span>
        <h2>Clasificación General</h2>
      </div>
      <div style="overflow-x:auto;">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Participante</th>
              <th>Pts</th>
              <th class="hide-mobile">🎯 Exactos</th>
              <th class="hide-mobile">✅ Resultado</th>
              <th>Efectividad</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>

    <div style="margin-top:1rem;font-size:0.8rem;color:var(--text-light);text-align:center;">
      🎯 Exacto = 3 pts · ✅ Resultado correcto = 1 pt · Se actualiza en tiempo real
    </div>
  `;
}

// ==================== HELPERS ====================
function showToast(msg, type = 'info') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

// ==================== BOOT ====================
init();

// Auto-refresh cada 2 minutos
setInterval(async () => {
  try {
    const r = await fetch('/api/leaderboard');
    const d = await r.json();
    renderLeaderboard(d);
  } catch (e) {}
}, 2 * 60 * 1000);
</script>
</body>
</html>
